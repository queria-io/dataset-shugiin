schema: bills
name: bills
title: 議案
description: |-
  衆議院ホームページの「議案」に載っている議案の一覧です。1 行が 1 件の議案で、最後に審議した国会での経過を持ちます。第142回国会（1998 年）から収録しています。

  - 議案種類（bill_type）・提出回次（submitted_session）・議案番号（bill_number）で 1 件に決まります。番号の無い承諾・決算などと修正案は入りません（bills.bill_sessions にあります）。同じ番号の回付案（例 参議院回付案（同意））も bills.bill_sessions にだけあります
  - 成立した法律は law_num で e_gov.laws.laws（新しく制定した法律）・e_gov.laws.revisions（改正する法律）と結合できます
  - 国会回次ごとの経過と、予備審査・付託の日付は bills.bill_sessions にあります
primary_key: [bill_type, submitted_session, bill_number]
sources:
  - path: https://www.shugiin.go.jp/internet/itdb_gian.nsf/html/gian/menu.htm
fields:
