schema: bills
name: texts
title: 議案の本文
description: |-
  衆議院ホームページの「議案」に載っている議案の本文です。1 行が本文のページ 1 つで、提出時法律案・要綱・修正案・決議案があります。本文は衆議院ホームページの表記のまま、改行を残したテキストにしています。表（給与表など）はセルをタブで区切ります。

  - 議案種類（bill_type）・提出回次（submitted_session）・議案番号（bill_number）で bills.bills と結合できます。修正案は、修正の対象になった議案の番号を持ちます
  - 提出時法律案は提出したときの本文です。修正されて成立した法律の条文は e_gov.laws.articles にあります
  - 本文情報が無い議案（予算・条約など）は入りません
primary_key: [text_url, bill_type, submitted_session, bill_number]
sources:
  - path: https://www.shugiin.go.jp/internet/itdb_gian.nsf/html/gian/menu.htm
fields:
