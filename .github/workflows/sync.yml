name: Apply

on:
  push:
    branches: [main]
  schedule:
    # 新しい 3 回分の国会の経過を毎週月曜 04:00 JST に取得し直す
    - cron: "0 19 * * 0"
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    # Queria への書き込みは GitHub Actions の OIDC で 1 時間のトークンを取って行う。
    # contents と pull-requests は、Queria で変更された説明をこのリポジトリに戻す PR に使う
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    uses: queria-io/dataset-shared/.github/workflows/sync.yml@f89cad790a98fd7ee528dcdb13cb1b2fb6a8b964
    with:
      dataset_name: shugiin
      # 初回は 100 分（GIAN_MAX_MINUTES）を超えたら取得し終えた国会回次までで止め、残りは次の回に取得する
      timeout_minutes: 150
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
