name: "shugiin"
version: "1.0.0"

profile: "shugiin"

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros", "shared/macros"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  shugiin:
    +database: shugiin
    +materialized: table
    # raw は取得したまま、stg は型付けと重複の除外。どちらも mart の SQL に展開し、テーブルは作らない
    bills:
      raw:
        +materialized: ephemeral
      stg:
        +materialized: ephemeral
