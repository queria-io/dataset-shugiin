# この dataset.yml は fdl commit が読む（FDL の dataset.json を YAML で書いたもの）。
# 表の説明は models/ の *.table.yml に書く。表と列の型・NULL・行数は fdl commit がカタログから埋める。
# Queria だけの項目（テーマ・カバー・列の意味）は annotations.queria に書く。
name: shugiin
title: 衆議院
description: |-
  衆議院が公開するデータです。今は衆議院ホームページの「議案」に載っている議案の審議経過を収録しています。

  議案（bills）は、第142回国会（1998 年）からの法律案（閣法・衆法・参法）・予算・条約・承認・決議などの審議経過です。議案ごとの最新の経過（bills.bills）、国会回次ごとの経過（bills.bill_sessions）、提出時法律案・要綱・修正案などの本文（bills.texts）のテーブルがあります。提出者・提出会派、衆議院と参議院それぞれの付託委員会・審査結果・審議結果、衆議院での賛成会派・反対会派、公布年月日と法律番号を持ちます。毎週、新しい 3 回分の国会の経過を取得し直します。

  成立した法律は法令番号（law_num）で e_gov.laws の法令と改正履歴と、審議した国会・委員会・日付で ndl.kokkai.meetings と結合できます。

  出典：衆議院ホームページ「議案」（https://www.shugiin.go.jp/internet/itdb_gian.nsf/html/gian/menu.htm）の議案の一覧・経過情報・本文情報から作成したものです。議案の本文は衆議院ホームページの表記のまま、改行を残したテキストにしています（表はセルをタブで区切ります）。
keywords:
  - 国会
  - 衆議院
  - 参議院
  - 議案
  - 法案
  - 法律案
  - 閣法
  - 議員立法
  - 審議経過
  - 委員会
  - 会派
homepage: https://github.com/queria-io/dataset-shugiin
language: ja
# 標準の利用許諾は無い。衆議院ホームページの「リンク・著作権等について」に従う。
# 議案の本文は手を加えずにテキストにする（ホームページの内容を無断で改変しない、という条件のため）
licenses:
  - id: shugiin-copyright
    title: 衆議院ホームページ リンク・著作権等について
    url: https://www.shugiin.go.jp/internet/itdb_annai.nsf/html/statics/link.html
    commercial_use: false
    share_alike: false
    attribution_required: true
sources:
  - title: 衆議院ホームページ 議案情報
    path: https://www.shugiin.go.jp/internet/itdb_gian.nsf/html/gian/menu.htm
contributors:
  - title: 衆議院
    path: https://www.shugiin.go.jp/
    roles: [publisher]
spatial_coverage: [JP]
update_frequency: weekly
schemas:
  - name: bills
    title: 議案
annotations:
  queria:
    themes: [government_finance]
    cover: 🏛️
